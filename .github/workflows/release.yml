name: Build release downloads

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag on main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # Tag pushes have no branch filter: explicitly check main ancestry.
      - name: Require a main commit and matching package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag) or tag != f'v{version}':
              raise SystemExit(f'Tag {tag!r} must be v{version}, matching pyproject.toml.')
          PY

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
            architecture: x64
          - target: macos-arm64
            runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            packaging/requirements.txt
            pyproject.toml
      - name: Install build and test dependencies
        run: python -m pip install . -r requirements-dev.txt -r packaging/requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build, package, and smoke-test extracted download
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/Unsettled-*.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Create draft GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Calculate download checksums
        working-directory: release
        run: sha256sum Unsettled-*.zip > SHA256SUMS.txt
      - name: Create draft with downloads and unsigned-build notice
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/*.zip release/SHA256SUMS.txt \
            --verify-tag --draft --title "Unsettled $RELEASE_TAG" \
            --notes-file packaging/RELEASE_NOTES.md --generate-notes
